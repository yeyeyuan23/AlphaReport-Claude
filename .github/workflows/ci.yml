name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/lint.txt
      - run: python -m pip install -r requirements/lint.txt
      - name: Check Python formatting
        run: ruff format --check .
      - name: Lint Python
        run: ruff check .
      - name: Check shell syntax
        run: bash -n start.sh deploy/deploy.sh scripts/ops/*.sh

  python-tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/bot.txt
            requirements/test.txt
      - run: python -m pip install -r requirements/test.txt
      - name: Run offline unit and integration tests
        run: python -m pytest -q

  frontend:
    name: Frontend format, lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check frontend formatting
        run: npm run format:check
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend components
        run: npm test
      - name: Type-check and build frontend
        run: npm run build
