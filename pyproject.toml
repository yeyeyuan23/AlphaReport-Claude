[project]
name = "alphareport"
version = "0.1.0"
description = "Quant research report collection, classification, analysis, and Feishu delivery assistant."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "AlphaReport Contributors" }
]
dependencies = [
  # Web 框架
  "fastapi>=0.104",
  "uvicorn[standard]>=0.24",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  # LLM
  "openai>=1.0",
  "anthropic>=0.42",
  "lark-oapi>=1.4",
  # PDF 处理
  "pymupdf>=1.24",
  # 数据源
  "arxiv>=2.1",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  # 向量检索
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  # 定时任务
  "apscheduler>=3.10",
  # 配置
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.14.10",
]

[project.scripts]
alphareport-api = "reportagent.main:serve"
alphareport-bot = "reportagent.bot.feishu:main"
alphareport-report = "reportagent.cli.report:main"
alphareport-skills = "reportagent.cli.skills:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reportagent"]

[tool.uv]
package = true

[tool.pytest.ini_options]
# Default checks are offline; real-model/source acceptance is explicitly opt-in.
testpaths = ["tests/unit", "tests/integration"]
norecursedirs = ["tests/acceptance"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
