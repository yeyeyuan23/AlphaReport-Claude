      - 梯度提升
      - XGBoost
      - LightGBM
      - CatBoost
      - 监督学习
      - 随机森林
      - 支持向量机
      - LASSO
      - 弹性网络
      - 集成学习
      - 神经网络
      - 注意力机制
      - 对比学习
      - 自监督学习
      - 迁移学习
