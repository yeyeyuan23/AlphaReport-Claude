      - 多因子
      - alpha因子
      - 因子挖掘
      - 因子择时
      - 风格因子
      - 行业轮动
      - 量价因子
      - 基本面因子
      - 另类数据
      - 因子拥挤
      - 因子衰减
      - IC
      - IR
      - 因子正交
