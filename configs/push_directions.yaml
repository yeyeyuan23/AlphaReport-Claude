    description: "另类数据源在量化投资中的应用与策略研究"

# ── 推送设置 ────────────────────────────────────────────────
push_settings:
  max_reviews: null  # 日报/周报的新全文评估预算；null 或省略表示不限，正整数表示限量
  max_featured: 5
  # 每次推送各方向最多展示论文数
  max_papers_per_direction: 5
  # 推送语言
  language: "zh"
  # 是否包含 A 股适用性评论
  include_a_share_commentary: true
  # ── LLM 筛选设置 ──
  # 全量拉取后 LLM 评分阈值（>= 此分数才推送）
  llm_filter_threshold: 6.0
  # LLM 每批处理论文数
  llm_batch_size: 10
  # 全量拉取模式（true=拉取所有q-fin论文，false=仅关键词搜索）
  broad_collection: true
  # collect.py 每个源最大拉取数（broad模式下建议调大）
  max_per_source_broad: 50
