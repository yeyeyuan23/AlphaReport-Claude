# ── AlphaReport (Claude Code Edition) ──────────────────

app:
  name: "AlphaReport-Claude"
  version: "2.0.0"

database:
  path: "data/report_library.db"

# ── Data Sources ──────────────────────────────────────
sources:
  local_pdf:
    enabled: true
    library_path: "data/pdf_library"
    import_on_startup: true  # 服务启动后，后台导入新增/内容变化的 PDF；只分类，不做深度分析

  arxiv:
    enabled: true
    rate_limit_seconds: 3
    download_pdfs: true
    search_scope:
      full_categories: ["q-fin"]  # 全部九个子类及跨分类公告，不加主题词限制
      topic_groups:
        - name: "ml_methods"
          categories: ["cs.LG", "stat.ML"]
          # 标题或摘要命中任意词组；不要求包含 finance。忽略大小写、连字符和换行。
          keywords:
            - "time series"
            - "probabilistic forecasting"
            - "probabilistic prediction"
            - "quantile regression"
            - "quantile forecasting"
            - "distribution shift"
            - "distributional shift"
            - "concept drift"
            - "online learning"
            - "learning to rank"
            - "cross sectional prediction"
            - "stock ranking"
            - "tabular learning"
            - "tabular data"
            - "tabular prediction"
        - name: "portfolio_execution"
          categories: ["math.OC"]
          keywords:
            - "portfolio optimization"
            - "portfolio selection"
            - "portfolio allocation"
            - "asset allocation"
            - "mean variance"
            - "optimal execution"
            - "transaction cost"
            - "transaction costs"
            - "turnover constraint"
            - "turnover constraints"
            - "robust portfolio"
            - "risk constrained optimization"
            - "risk constrained portfolio"

  eastmoney:
    enabled: true
    rate_limit_seconds: 1
    default_lookback_days: 180

  bigquant:
    enabled: true
    rate_limit_seconds: 2

# ── Classification ────────────────────────────────────
classification:
  taxonomy_path: "configs/classification_taxonomy.yaml"
  rule_confidence_threshold: 0.7

# ── LLM ──────────────────────────────────────────────
llm:
  thinking: "disabled"  # 结构化分类/分析留足输出空间；Anthropic 兼容接口使用
  provider: "anthropic"
  model: "deepseek-v4-pro"
  # 用 DEEPSEEK_* 专属变量名，不要复用 ANTHROPIC_*：
  # Claude Code 自身会在 shell 里注入 ANTHROPIC_AUTH_TOKEN(OAuth 令牌) 和
  # ANTHROPIC_BASE_URL(官方端点)，复用同名变量会被它们覆盖 -> 401 invalid x-api-key。
  api_key_env: "DEEPSEEK_API_KEY"
  base_url_env: "DEEPSEEK_BASE_URL"

# ── Collection ────────────────────────────────────────
collection:
  max_concurrent_sources: 4
  pdf:
    max_size_mb: 25  # MiB；部署者可提高，不代表论文质量或模型输入上限
    download_timeout_seconds: 45  # 每次下载独立限时，不包含解析
    parse_timeout_seconds: 20
    max_attempts: 3  # 包含首次请求；仅网络异常/408/429/500/502/503/504重试
    retry_backoff_seconds: 2
    max_retry_delay_seconds: 30  # Retry-After 与指数退避均受此上限约束

# ── Feishu Bot ────────────────────────────────────────
feishu:
  enabled: true
  app_id_env: "FEISHU_APP_ID"
  app_secret_env: "FEISHU_APP_SECRET"
  verification_token_env: "FEISHU_VERIFICATION_TOKEN"

# ── Independent collection and reporting schedules ─────
daily_collection:
  enabled: true
  timezone: "Asia/Shanghai"
  schedule_cron: "08:00"  # 每天，含周末；采集、筛选、下载入库和全文质量评估
  max_reviews: null  # 新全文评估预算；null 或省略表示不限，失败项在后续采集时重试
  sources: [arxiv, eastmoney, bigquant]
  # 自动采集与日报固定使用昨天的来源日期，不设候选数量上限。

daily_report:
  enabled: true  # Web 运行时，每天从论文库生成并发送日报
  timezone: "Asia/Shanghai"
  schedule_cron: "09:00"

weekly_report:
  enabled: true  # Web 运行时，每周从论文库生成并发送周报
  timezone: "Asia/Shanghai"
  day_of_week: "fri"  # mon/tue/wed/thu/fri/sat/sun 分别为周一至周日
  schedule_cron: "09:00"

# ── Server ────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8000

# One skill library for every adapter.
skills:
  builtin_dir: "skills"
