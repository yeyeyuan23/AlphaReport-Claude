services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: alphareport
    container_name: alphareport-backend
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - ${ENV_FILE:-/data1/alphareport/.env}
    environment:
      ALPHAREPORT_DEPLOYMENT: "true"
      ALPHAREPORT_BIND_HOST: "0.0.0.0"
      ALPHAREPORT_PORT: "8000"
      ALPHAREPORT_PUBLIC_TUNNEL: "false"
      HOME: /app/data/runtime-home
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    ports:
      - "${PORT:-80}:8000"
    volumes:
      - ${DATA_DIR:-/data1/alphareport/data}:/app/data
      - ${CONFIG_DIR:-/data1/alphareport/configs}/app.yaml:/app/configs/app.yaml:ro
      - ${BOT_STATE_DIR:-/data1/alphareport/bot_state}:/app/.claude-bot
    command: ["bash", "start.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=3))['data']; assert d['server']=='ok' and d['feishu_ws']"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
